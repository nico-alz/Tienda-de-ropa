<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Todo a 10.000</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="pantalla-login">
  <div class="tarjeta-login">
    <div class="marca">
      <span class="cifra">TODO A 10.000</span>
      <h1>Iniciar sesión</h1>
      <p>Ingresa con tu usuario del almacén</p>
    </div>

    <div id="mensaje-error" class="mensaje-error oculto"></div>

    <form id="form-login">
      <div class="campo">
        <label for="nombre_usuario">Usuario</label>
        <input type="text" id="nombre_usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-principal">Entrar</button>
    </form>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
